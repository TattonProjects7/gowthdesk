<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Shortlist</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0f1a; color: #e8eaf4; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; box-sizing: border-box; }
    .logo { width: 64px; height: 64px; border-radius: 18px; background: #e11d48; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #a0a9cc; font-size: 14px; line-height: 1.5; max-width: 320px; margin: 0; }
    code { color: #fda4af; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg></div>
    <h1>Shortlist</h1>
    <p>This build has no server address yet. Set <code>NEXT_PUBLIC_APP_URL</code> to your deployed https URL and run <code>npx cap sync</code> — see MOBILE.md.</p>
  </div>
  <script src="config.js"></script>
  <script>if (window.SHORTLIST_URL) location.replace(window.SHORTLIST_URL + "/portfolio");</script>
</body>
</html>
