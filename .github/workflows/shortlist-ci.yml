name: Shortlist CI

# Shortlist lives in shortlist/; GrowthDesk and SiteCalc at the root are built by Vercel.

on:
  push:
    branches: ["**"]
    paths:
      - "shortlist/**"
      - ".github/workflows/shortlist-ci.yml"
  pull_request:
    paths:
      - "shortlist/**"
      - ".github/workflows/shortlist-ci.yml"

defaults:
  run:
    working-directory: shortlist

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shortlist/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Build must succeed with no backend configured (zero-config mode).
          NEXT_TELEMETRY_DISABLED: "1"
