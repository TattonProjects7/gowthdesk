name: Shortlist iOS

# Builds the iPhone app on a macOS runner.
#   - Always: compiles the app for the simulator (no Apple account needed), so a
#     broken native build is caught straight away.
#   - With the App Store Connect secrets set: archives, signs (automatic signing
#     via the API key) and uploads to TestFlight when run manually with "upload"
#     ticked, or on any run while the variable TESTFLIGHT_AUTO_UPLOAD is "true".
# Opens https://gowthdesk-jpim.vercel.app unless the repository variable APP_URL
# says otherwise (GO-LIVE.md).

on:
  push:
    branches: ["**"]
    paths:
      - "shortlist/ios/**"
      - "shortlist/mobile/**"
      - "shortlist/capacitor.config.ts"
      - "shortlist/scripts/mobile-env.mjs"
      - "shortlist/package.json"
      - "shortlist/package-lock.json"
      - ".github/workflows/shortlist-ios.yml"
  workflow_dispatch:
    inputs:
      upload:
        description: "Archive and upload to TestFlight"
        type: boolean
        default: false

defaults:
  run:
    working-directory: shortlist

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      # The live site the app opens. Set the repository variable APP_URL to
      # change it (for example to a custom domain).
      NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL || 'https://gowthdesk-jpim.vercel.app' }}
      HAS_ASC: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' }}
      # Tatton Projects' Apple Developer team (not a secret: it's in every signed app).
      # The APPLE_TEAM_ID secret overrides it.
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'UJ6WA4G6H9' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: shortlist/package-lock.json

      - run: npm ci

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Sync the native project
        run: node scripts/mobile-env.mjs && npx cap sync ios

      # AdMob app ID (repository variable). Unset: Google's sample ID stays, no live ads.
      - name: Set the AdMob app ID
        if: ${{ vars.ADMOB_APP_ID_IOS != '' }}
        env:
          ADMOB_APP_ID_IOS: ${{ vars.ADMOB_APP_ID_IOS }}
        run: /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $ADMOB_APP_ID_IOS" ios/App/App/Info.plist

      - name: Build for the simulator (no signing)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      # Says which App Store Connect secrets this run can see (never their values),
      # and stops a requested upload with a clear message if one is missing.
      - name: Check the App Store Connect secrets
        env:
          HAS_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAS_KEY_P8: ${{ secrets.ASC_KEY_P8 != '' }}
          WANT_UPLOAD: ${{ (github.event_name == 'workflow_dispatch' && inputs.upload) || vars.TESTFLIGHT_AUTO_UPLOAD == 'true' }}
        run: |
          for pair in "ASC_KEY_ID:$HAS_KEY_ID" "ASC_ISSUER_ID:$HAS_ISSUER_ID" "ASC_KEY_P8:$HAS_KEY_P8"; do
            name="${pair%%:*}"; ok="${pair##*:}"
            if [ "$ok" = "true" ]; then echo "$name: set"; else echo "$name: MISSING"; fi
          done
          echo "Upload requested: $WANT_UPLOAD"
          if [ "$WANT_UPLOAD" = "true" ] && [ "$HAS_ASC" != "true" ]; then
            echo "::error::TestFlight upload was requested but an App Store Connect secret is missing. Add it under Settings > Secrets and variables > Actions > Repository secrets (exact names above)."
            exit 1
          fi

      # Proves the three secrets actually log in to Apple, and says which one is
      # wrong if they don't — before the slow archive. Apple returns HTTP 401
      # when the Key ID, Issuer ID and .p8 don't all belong to one App-Manager
      # key, which is the usual cause of "Communication with Apple failed".
      - name: Verify the App Store Connect key
        if: env.HAS_ASC == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.upload) || vars.TESTFLIGHT_AUTO_UPLOAD == 'true')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          python3 -m venv "$RUNNER_TEMP/ascvenv"
          "$RUNNER_TEMP/ascvenv/bin/pip" install --quiet --disable-pip-version-check PyJWT cryptography
          "$RUNNER_TEMP/ascvenv/bin/python" <<'PY'
          import os, re, sys, time, textwrap, urllib.request, urllib.error
          import jwt
          kid = os.environ["ASC_KEY_ID"].strip()
          iss = os.environ["ASC_ISSUER_ID"].strip()
          raw = os.environ["ASC_KEY_P8"].strip()
          m = re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----", raw, re.S)
          body = re.sub(r"\s+", "", m.group(1) if m else raw)
          pem = "-----BEGIN PRIVATE KEY-----\n" + "\n".join(textwrap.wrap(body, 64)) + "\n-----END PRIVATE KEY-----\n"
          print("Key ID is", len(kid), "characters (Apple Key IDs are 10).")
          print("Issuer ID is a UUID:", bool(re.fullmatch(r"[0-9a-fA-F-]{36}", iss)))
          if len(kid) != 10:
              print("::error::ASC_KEY_ID should be the 10-character Key ID from App Store Connect, not the Issuer ID or Team ID.")
              sys.exit(1)
          if not re.fullmatch(r"[0-9a-fA-F-]{36}", iss):
              print("::error::ASC_ISSUER_ID should be the Issuer ID (a long UUID like 69a6de70-...), shown above the key list on the App Store Connect API page. It looks like something else was pasted.")
              sys.exit(1)
          try:
              tok = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 300, "aud": "appstoreconnect-v1"}, pem, algorithm="ES256", headers={"kid": kid, "typ": "JWT"})
          except Exception as e:
              print("::error::ASC_KEY_P8 is not a valid key. Re-copy the whole .p8 file, including the BEGIN and END lines. (%s)" % e)
              sys.exit(1)
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1", headers={"Authorization": "Bearer " + tok})
          try:
              r = urllib.request.urlopen(req, timeout=25)
              print("Apple accepted the key (HTTP %d). Credentials are good." % r.status)
          except urllib.error.HTTPError as e:
              print("Apple rejected the key (HTTP %d):" % e.code)
              print(e.read().decode("utf-8", "replace")[:600])
              if e.code in (401, 403):
                  print("::error::Apple rejected the API key (HTTP %d). The Key ID, Issuer ID and .p8 file must ALL come from the same key, and that key needs the App Manager or Admin role. Generate one key with App Manager access and set all three secrets from it." % e.code)
                  sys.exit(1)
              print("::warning::Unexpected HTTP %d from Apple; continuing to the build." % e.code)
          except Exception as e:
              print("::warning::Could not reach Apple to pre-check the key (%s); continuing to the build." % e)
          PY

      - name: Archive and upload to TestFlight
        # Manual "Run workflow" (once this file is on main), or any run while the
        # repository variable TESTFLIGHT_AUTO_UPLOAD is "true".
        if: env.HAS_ASC == 'true' && ((github.event_name == 'workflow_dispatch' && inputs.upload) || vars.TESTFLIGHT_AUTO_UPLOAD == 'true')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          # Rebuild the .p8 tolerantly: if the line breaks were lost when the
          # secret was pasted, re-wrap the key body so xcodebuild can read it.
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          python3 -c 'import os,re,sys,textwrap; raw=os.environ["ASC_KEY_P8"].strip(); m=re.search(r"-----BEGIN PRIVATE KEY-----(.*?)-----END PRIVATE KEY-----", raw, re.S); body=re.sub(r"\s+","", m.group(1) if m else raw); open(sys.argv[1],"w").write("-----BEGIN PRIVATE KEY-----\n"+"\n".join(textwrap.wrap(body,64))+"\n-----END PRIVATE KEY-----\n")' "$KEY"
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $KEY -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} $AUTH archive
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" $AUTH
          rm -f "$KEY"
